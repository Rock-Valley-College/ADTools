name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package ADTools
        run: |
          zip -j "ADTools-${GITHUB_REF_NAME}.zip" ADTools.ps1 config.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ADTools-*.zip
          generate_release_notes: true
